<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMS - Hospital Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, h5, h6, .login-brand-title, .login-heading {
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.02em;
    }
    .login-container-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 40px -10px rgba(15, 23, 42, 0.12);
      width: 100%;
      max-width: 860px;
      display: flex;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      min-height: 520px;
    }
    /* LEFT SIDE: EXACT BLUE HOSPITAL STETHOSCOPE BANNER */
    .login-left-banner {
      width: 48%;
      background: linear-gradient(180deg, rgba(16, 92, 204, 0.76) 0%, rgba(20, 105, 225, 0.52) 45%, rgba(10, 70, 175, 0.30) 100%), 
                  url('assets/images/login-bg.jpg') center center / cover no-repeat;
      padding: 3.5rem 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      color: #ffffff;
      position: relative;
    }
    .login-brand-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .login-brand-subtitle {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: 0.2px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    }
    .login-brand-tagline {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 400;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    /* RIGHT SIDE: EXACT FORM */
    .login-right-form {
      width: 52%;
      padding: 3rem 2.8rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #ffffff;
    }
    .login-heading {
      font-size: 1.7rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.25rem;
      letter-spacing: -0.3px;
    }
    .login-subtext {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1.8rem;
    }
    .form-group-custom {
      margin-bottom: 1.25rem;
    }
    .custom-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #334155;
      margin-bottom: 0.45rem;
    }
    .custom-input {
      width: 100%;
      padding: 0.65rem 0.95rem;
      font-size: 0.9rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: #1e293b;
      background-color: #fafbfc;
      outline: none;
      transition: all 0.2s ease;
    }
    .custom-input:focus {
      background-color: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }
    .custom-input::placeholder {
      color: #94a3b8;
      font-size: 0.88rem;
    }
    .custom-select {
      width: 100%;
      padding: 0.65rem 0.95rem;
      font-size: 0.9rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: #1e293b;
      background-color: #fafbfc;
      outline: none;
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.85rem center;
      background-size: 14px 10px;
      appearance: none;
      -webkit-appearance: none;
      transition: all 0.2s ease;
    }
    .custom-select:focus {
      background-color: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }
    .btn-login-blue {
      background: #0d6efd;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
    }
    .btn-login-blue:hover {
      background: #0b5ed7;
      box-shadow: 0 6px 16px rgba(13, 110, 253, 0.35);
    }
    .login-footer-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }
    .forgot-link {
      color: #0d6efd;
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .forgot-link:hover {
      color: #0a58ca;
      text-decoration: underline;
    }
    /* DEMO HELPER PILLS */
    .demo-role-badges {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px dashed #e2e8f0;
      text-align: center;
    }
    .demo-role-btn {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      cursor: pointer;
      margin: 2px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .demo-role-btn:hover {
      background: #0d6efd;
      color: #ffffff;
      border-color: #0d6efd;
    }

    /* RESPONSIVENESS */
    @media (max-width: 768px) {
      body {
        padding: 0.75rem;
      }
      .login-container-card {
        flex-direction: column;
        max-width: 440px;
        min-height: auto;
        border-radius: 16px;
      }
      .login-left-banner {
        width: 100%;
        padding: 2rem 1.25rem 1.6rem;
        min-height: 215px;
        background: linear-gradient(180deg, rgba(14, 82, 195, 0.74) 0%, rgba(20, 102, 220, 0.45) 45%, rgba(10, 68, 170, 0.22) 100%), 
                    url('assets/images/login-bg.jpg') center 72% / cover no-repeat !important;
      }
      .login-brand-title {
        font-size: 1.85rem;
      }
      .login-right-form {
        width: 100%;
        padding: 1.75rem 1.25rem;
      }
      .custom-input,
      .custom-select {
        font-size: 16px !important;
        padding: 0.75rem 0.95rem;
      }
      .btn-login-blue {
        padding: 0.85rem 1rem;
        font-size: 1rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
      }
      .login-left-banner {
        min-height: 200px;
        padding: 1.6rem 1rem 1.35rem;
        background: linear-gradient(180deg, rgba(14, 82, 195, 0.75) 0%, rgba(20, 102, 220, 0.45) 48%, rgba(10, 68, 170, 0.22) 100%), 
                    url('assets/images/login-bg.jpg') center 72% / cover no-repeat !important;
      }
      .login-brand-title {
        font-size: 1.6rem;
      }
      .login-heading {
        font-size: 1.4rem;
      }
      .login-right-form {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- MAIN CARD CONTAINER (EXACT MATCH TO REFERENCE IMAGE) -->
  <div class="login-container-card">
    
    <!-- LEFT SIDE: HMS BLUE MEDICAL HERO -->
    <div class="login-left-banner">
      <div class="login-brand-title">HMS</div>
      <div class="login-brand-subtitle">Hospital Management System</div>
      <div class="login-brand-tagline">Better Care. Healthier Tomorrow.</div>
    </div>

    <!-- RIGHT SIDE: LOGIN FORM -->
    <div class="login-right-form">
      <h2 class="login-heading">Welcome Back!</h2>
      <p class="login-subtext">Login to your account</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- FIELD 1: USERNAME / EMAIL -->
        <div class="form-group-custom">
          <label class="custom-label" for="usernameInput">Username / Email</label>
          <input 
            type="text" 
            class="custom-input" 
            id="usernameInput" 
            placeholder="Enter your username" 
            value="admin@medpulse.com" 
            required
          >
        </div>

        <!-- FIELD 2: PASSWORD -->
        <div class="form-group-custom">
          <label class="custom-label" for="passwordInput">Password</label>
          <div class="position-relative">
            <input 
              type="password" 
              class="custom-input" 
              id="passwordInput" 
              placeholder="Enter your password" 
              value="password123" 
              style="padding-right: 2.5rem;"
              required
            >
            <i 
              class="bi bi-eye text-muted position-absolute top-50 end-0 translate-middle-y me-3" 
              id="togglePasswordIcon" 
              style="cursor: pointer; font-size: 0.95rem;" 
              onclick="togglePasswordVisibility()" 
              title="Show/Hide Password"
            ></i>
          </div>
        </div>

        <!-- FIELD 3: SELECT ROLE -->
        <div class="form-group-custom">
          <label class="custom-label" for="roleSelect">Select Role</label>
          <select class="custom-select" id="roleSelect" onchange="handleRoleChange()" required>
            <option value="Admin" selected>Admin</option>
            <option value="Doctor">Doctor</option>
            <option value="Receptionist">Receptionist</option>
            <option value="Patient">Patient</option>
          </select>
        </div>

        <!-- LOGIN BUTTON -->
        <button type="submit" class="btn-login-blue">
          Login
        </button>

        <!-- FORGOT PASSWORD LINKS (MATCHING REFERENCE) -->
        <div class="login-footer-links">
          <a href="javascript:void(0)" class="forgot-link" onclick="alert('Demo notice: Any password or 1-click role button will log you in!')">
            Forgot Password?
          </a>
          <a href="index.html" class="forgot-link">
            Public Website
          </a>
        </div>

        <!-- 1-CLICK DEMO LOGIN BUTTONS -->
        <div class="demo-role-badges">
          <div class="text-muted small mb-1" style="font-size: 0.72rem;">Quick Role Switch (Demo):</div>
          <button type="button" class="demo-role-btn" onclick="quickLogin('Admin')">Admin</button>
          <button type="button" class="demo-role-btn" onclick="quickLogin('Doctor')">Doctor</button>
          <button type="button" class="demo-role-btn" onclick="quickLogin('Receptionist')">Receptionist</button>
          <button type="button" class="demo-role-btn" onclick="quickLogin('Patient')">Patient</button>
        </div>

      </form>
    </div>

  </div>

  <!-- CORE SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/dummyData.js"></script>
  <script src="assets/js/dataStore.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    function handleRoleChange() {
      const role = document.getElementById('roleSelect').value;
      const emailInput = document.getElementById('usernameInput');
      if (role === 'Admin') emailInput.value = 'admin@medpulse.com';
      else if (role === 'Doctor') emailInput.value = 'dr.priya@medpulse.com';
      else if (role === 'Receptionist') emailInput.value = 'reception@medpulse.com';
      else if (role === 'Patient') emailInput.value = 'sneha.r@example.com';
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('passwordInput');
      const icon = document.getElementById('togglePasswordIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('roleSelect').value;
      const email = document.getElementById('usernameInput').value;
      const pwd = document.getElementById('passwordInput').value;

      HMSAuth.login(role, email, pwd);
      HMSApp.showToast(`Logged in successfully as ${role}! Redirecting...`, 'success');

      setTimeout(() => {
        window.location.href = `pages/${role.toLowerCase()}/dashboard.html`;
      }, 400);
    }

    function quickLogin(role) {
      document.getElementById('roleSelect').value = role;
      handleRoleChange();
      HMSAuth.login(role);
      HMSApp.showToast(`Quick login as ${role}...`, 'info');
      setTimeout(() => {
        window.location.href = `pages/${role.toLowerCase()}/dashboard.html`;
      }, 350);
    }
  </script>
</body>
</html>
