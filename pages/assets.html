<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Asset Management - MedPulse HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

  <div class="hms-wrapper">
    <!-- SIDEBAR -->
    <aside class="hms-sidebar" id="hms-sidebar"></aside>

    <!-- MAIN -->
    <div class="hms-main">
      <!-- HEADER -->
      <header class="hms-header" id="hms-header"></header>

      <!-- CONTENT BODY -->
      <main class="hms-content-body">
        
        <!-- HEADER & ACTIONS -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
          <div>
            <h2 class="fw-bold mb-1">Hospital Biomedical & Facility Asset Inventory</h2>
            <p class="text-muted mb-0 small">Track critical medical equipment, diagnostic instruments, maintenance logs, and hospital infrastructure.</p>
          </div>
          <div>
            <button class="btn btn-primary" onclick="openAddAssetModal()">
              <i class="bi bi-plus-circle me-1"></i> Add Hospital Asset
            </button>
          </div>
        </div>

        <!-- SEARCH & FILTER TOOLBAR -->
        <div class="card border-0 shadow-sm rounded-4 mb-4 bg-white">
          <div class="card-body p-3">
            <div class="row g-2 align-items-center">
              <div class="col-12 col-md-5">
                <div class="input-group input-group-sm">
                  <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
                  <input type="text" class="form-control" id="assetSearchInput" placeholder="Search by asset name, serial ID, location...">
                </div>
              </div>
              <div class="col-6 col-md-3">
                <select class="form-select form-select-sm" id="assetCategoryFilter" onchange="filterAssets()">
                  <option value="">All Categories</option>
                  <option value="Biomedical">Biomedical Equipment</option>
                  <option value="Surgical Instruments">Surgical Instruments</option>
                  <option value="IT Equipment">IT & Network Equipment</option>
                  <option value="Furniture & Ward">Furniture & Ward</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <select class="form-select form-select-sm" id="assetStatusFilter" onchange="filterAssets()">
                  <option value="">All Statuses</option>
                  <option value="Working">Working</option>
                  <option value="Maintenance">In Maintenance</option>
                  <option value="Not Available">Not Available</option>
                </select>
              </div>
              <div class="col-12 col-md-1 text-end">
                <button class="btn btn-sm btn-outline-secondary w-100" onclick="resetAssetFilters()">
                  <i class="bi bi-arrow-counterclockwise"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- ASSETS TABLE -->
        <div class="hms-table-wrapper">
          <div class="table-responsive">
            <table class="hms-table text-nowrap">
              <thead>
                <tr>
                  <th>Asset Serial / Tag</th>
                  <th>Equipment Name</th>
                  <th>Category</th>
                  <th>Hospital Location</th>
                  <th>Purchase Date</th>
                  <th>Last Maintenance</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="assetTableBody">
                <!-- Loaded via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- MODAL: ADD / EDIT ASSET -->
  <div class="modal fade" id="assetFormModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form onsubmit="saveAsset(event)">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="assetModalTitle"><i class="bi bi-box-seam text-primary me-2"></i> Add Hospital Asset</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="assetEditId">
            <div class="row g-3">
              <div class="col-12 col-md-4">
                <label class="form-label">Asset Tag / Serial ID <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="aSerial" placeholder="e.g. EQ-BIO-305" required>
              </div>
              <div class="col-12 col-md-8">
                <label class="form-label">Asset Name & Model <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="aName" placeholder="e.g. Hamilton C6 Ventilator" required>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Category <span class="text-danger">*</span></label>
                <select class="form-select" id="aCategory" required>
                  <option value="Biomedical">Biomedical</option>
                  <option value="Surgical Instruments">Surgical Instruments</option>
                  <option value="IT Equipment">IT Equipment</option>
                  <option value="Furniture & Ward">Furniture & Ward</option>
                </select>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Hospital Location / Ward <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="aLocation" placeholder="e.g. ICU Bay 4, OT 2, Radiology" required>
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label">Purchase Date</label>
                <input type="date" class="form-control" id="aPurchase" value="2025-05-12">
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label">Next Maintenance Due</label>
                <input type="date" class="form-control" id="aMaintenance" value="2026-11-20">
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label">Operational Status</label>
                <select class="form-select" id="aStatus">
                  <option value="Working" selected>Working</option>
                  <option value="Maintenance">Maintenance</option>
                  <option value="Not Available">Not Available</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Save Asset</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../data/dummyData.js"></script>
  <script src="../assets/js/dataStore.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/apiService.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>

  <script>
    let allAssets = [];

    document.addEventListener('DOMContentLoaded', async () => {
      HMSNav.init('assets', 'Hospital Asset Inventory', ['Home', 'Operations', 'Assets'], 'inventory.view');
      await loadAssets();
      document.getElementById('assetSearchInput').addEventListener('input', filterAssets);
    });

    async function loadAssets() {
      allAssets = await HMSApi.assets.getAll();
      renderAssetsTable(allAssets);
    }

    function renderAssetsTable(assets) {
      const tbody = document.getElementById('assetTableBody');
      if (assets.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-5">No assets found.</td></tr>`;
        return;
      }

      tbody.innerHTML = assets.map(a => `
        <tr>
          <td><span class="badge bg-light text-primary border fw-bold">${a.assetId}</span></td>
          <td><div class="fw-bold text-dark">${a.name}</div></td>
          <td><span class="badge bg-secondary-subtle text-secondary">${a.category}</span></td>
          <td><i class="bi bi-geo-alt text-danger me-1"></i>${a.location}</td>
          <td class="text-muted small">${HMSApp.formatDate(a.purchaseDate)}</td>
          <td class="text-muted small">${HMSApp.formatDate(a.maintenanceDate)}</td>
          <td>${HMSApp.renderStatusBadge(a.status === 'Working' ? 'Active' : a.status)}</td>
          <td class="text-end">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-secondary" title="Edit Asset" onclick="editAsset('${a.id}')">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-outline-danger" title="Delete Asset" onclick="deleteAsset('${a.id}')">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterAssets() {
      const query = document.getElementById('assetSearchInput').value.toLowerCase().trim();
      const cat = document.getElementById('assetCategoryFilter').value;
      const status = document.getElementById('assetStatusFilter').value;

      const filtered = allAssets.filter(a => {
        const matchesQuery = !query ||
          a.assetId.toLowerCase().includes(query) ||
          a.name.toLowerCase().includes(query) ||
          a.location.toLowerCase().includes(query);

        const matchesCat = !cat || a.category === cat;
        const matchesStatus = !status || a.status === status;
        return matchesQuery && matchesCat && matchesStatus;
      });

      renderAssetsTable(filtered);
    }

    function resetAssetFilters() {
      document.getElementById('assetSearchInput').value = '';
      document.getElementById('assetCategoryFilter').value = '';
      document.getElementById('assetStatusFilter').value = '';
      renderAssetsTable(allAssets);
    }

    function openAddAssetModal() {
      document.getElementById('assetEditId').value = '';
      document.getElementById('assetModalTitle').innerHTML = '<i class="bi bi-box-seam text-primary me-2"></i> Add Hospital Asset';
      document.getElementById('aSerial').value = `EQ-${Math.floor(100 + Math.random() * 900)}`;
      document.getElementById('aName').value = '';
      document.getElementById('aLocation').value = '';
      new bootstrap.Modal(document.getElementById('assetFormModal')).show();
    }

    async function editAsset(id) {
      const a = allAssets.find(item => item.id === id);
      if (!a) return;

      document.getElementById('assetEditId').value = a.id;
      document.getElementById('assetModalTitle').innerHTML = '<i class="bi bi-pencil-square text-primary me-2"></i> Edit Asset';
      document.getElementById('aSerial').value = a.assetId;
      document.getElementById('aName').value = a.name;
      document.getElementById('aCategory').value = a.category;
      document.getElementById('aLocation').value = a.location;
      document.getElementById('aPurchase').value = a.purchaseDate || '2025-01-01';
      document.getElementById('aMaintenance').value = a.maintenanceDate || '2026-12-01';
      document.getElementById('aStatus').value = a.status;

      new bootstrap.Modal(document.getElementById('assetFormModal')).show();
    }

    async function saveAsset(e) {
      e.preventDefault();
      const editId = document.getElementById('assetEditId').value;
      const data = {
        assetId: document.getElementById('aSerial').value,
        name: document.getElementById('aName').value,
        category: document.getElementById('aCategory').value,
        location: document.getElementById('aLocation').value,
        purchaseDate: document.getElementById('aPurchase').value,
        maintenanceDate: document.getElementById('aMaintenance').value,
        status: document.getElementById('aStatus').value
      };

      if (editId) {
        await HMSApi.assets.update(editId, data);
        HMSApp.showToast(`Asset "${data.name}" updated.`, 'success');
      } else {
        await HMSApi.assets.create(data);
        HMSApp.showToast(`Asset "${data.name}" cataloged.`, 'success');
      }

      bootstrap.Modal.getInstance(document.getElementById('assetFormModal')).hide();
      await loadAssets();
    }

    async function deleteAsset(id) {
      if (confirm('Are you sure you want to remove this equipment record?')) {
        await HMSApi.assets.delete(id);
        HMSApp.showToast('Asset record removed.', 'danger');
        await loadAssets();
      }
    }
  </script>
</body>
</html>
