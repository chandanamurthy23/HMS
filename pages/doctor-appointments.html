<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Appointments - HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

  <div class="hms-wrapper">
    <!-- SIDEBAR -->
    <aside class="hms-sidebar" id="hms-sidebar"></aside>

    <!-- MAIN -->
    <div class="hms-main">
      <!-- HEADER -->
      <header class="hms-header" id="hms-header"></header>

      <!-- CONTENT BODY -->
      <main class="hms-content-body">
        
        <!-- DOCTOR PROFILE BANNER (Reference Image Screen 5) -->
        <div class="card border-0 rounded-4 p-4 text-white mb-4 shadow-sm" style="background: linear-gradient(135deg, #0d6efd 0%, #1e40af 100%);">
          <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-3">
              <img src="../assets/images/doctors/dr-priya.jpg" onerror="this.src='https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&q=80&w=256'" class="rounded-circle border border-2 border-white shadow-sm" width="64" height="64" style="object-fit: cover;">
              <div>
                <span class="badge bg-white text-primary fw-semibold px-3 py-1 rounded-pill mb-1">Cardiology Department</span>
                <h3 class="fw-bold mb-0">Dr. Priya S</h3>
                <p class="mb-0 opacity-90 small">OPD Suite 102 • Schedule: 10:00 AM - 02:00 PM</p>
              </div>
            </div>

            <div class="d-flex gap-2 align-items-center">
              <span class="badge bg-success-subtle text-success border px-3 py-2 rounded-pill fs-6">
                <i class="bi bi-check-circle-fill me-1"></i> Available for Consultations
              </span>
              <a href="consultation.html" class="btn btn-light fw-semibold text-primary">
                <i class="bi bi-clipboard2-pulse me-1"></i> Active Consultation Room
              </a>
            </div>
          </div>
        </div>

        <!-- TIMELINE FILTER TABS: [Today] / [Upcoming] / [Past] (Reference Image Screen 5) -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
          <div class="btn-group shadow-sm" role="group">
            <button type="button" class="btn btn-outline-primary active px-3 px-md-4 fw-semibold" id="tabDocToday" onclick="filterDocTimeline('Today')">
              <i class="bi bi-calendar2-day me-1"></i> Today
            </button>
            <button type="button" class="btn btn-outline-primary px-3 px-md-4 fw-semibold" id="tabDocUpcoming" onclick="filterDocTimeline('Upcoming')">
              <i class="bi bi-calendar-event me-1"></i> Upcoming
            </button>
            <button type="button" class="btn btn-outline-primary px-3 px-md-4 fw-semibold" id="tabDocPast" onclick="filterDocTimeline('Past')">
              <i class="bi bi-clock-history me-1"></i> Past
            </button>
          </div>

          <div class="input-group input-group-sm" style="max-width: 280px;">
            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
            <input type="text" class="form-control" id="docQueueSearch" placeholder="Search patient..." oninput="renderFilteredDocQueue()">
          </div>
        </div>

        <!-- APPOINTMENT QUEUE TABLE (Reference Image Screen 5) -->
        <div class="hms-table-wrapper">
          <div class="table-responsive">
            <table class="hms-table align-middle text-nowrap">
              <thead>
                <tr>
                  <th>Token / Time</th>
                  <th>Patient</th>
                  <th>Age / Gender</th>
                  <th>Chief Symptoms</th>
                  <th>Status</th>
                  <th class="text-end">Action</th>
                </tr>
              </thead>
              <tbody id="docQueueTableBody">
                <!-- Dynamically loaded via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../data/dummyData.js"></script>
  <script src="../assets/js/dataStore.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/apiService.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>

  <script>
    let allDocAppointments = [];
    let currentDocTimeline = 'Today';

    document.addEventListener('DOMContentLoaded', async () => {
      HMSNav.init('consultation', 'Doctor Appointments', ['Home', 'Doctor View']);
      await loadDoctorAppointments();
    });

    async function loadDoctorAppointments() {
      allDocAppointments = await HMSApi.appointments.getAll();
      renderFilteredDocQueue();
    }

    function filterDocTimeline(timeline) {
      currentDocTimeline = timeline;
      document.getElementById('tabDocToday').classList.toggle('active', timeline === 'Today');
      document.getElementById('tabDocUpcoming').classList.toggle('active', timeline === 'Upcoming');
      document.getElementById('tabDocPast').classList.toggle('active', timeline === 'Past');
      renderFilteredDocQueue();
    }

    function renderFilteredDocQueue() {
      const query = document.getElementById('docQueueSearch').value.toLowerCase().trim();
      const todayStr = '2026-09-16';

      const filtered = allDocAppointments.filter(a => {
        const matchesQuery = !query || a.patientName.toLowerCase().includes(query) || a.patientId.toLowerCase().includes(query) || a.reason.toLowerCase().includes(query);
        
        let matchesTimeline = true;
        if (currentDocTimeline === 'Today') matchesTimeline = a.date === todayStr;
        else if (currentDocTimeline === 'Upcoming') matchesTimeline = a.date > todayStr;
        else if (currentDocTimeline === 'Past') matchesTimeline = a.date < todayStr || a.status === 'Completed';

        return matchesQuery && matchesTimeline;
      });

      const tbody = document.getElementById('docQueueTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-5">No appointments in ${currentDocTimeline} queue.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((a, idx) => `
        <tr>
          <td>
            <div class="fw-bold text-dark">${a.time}</div>
            <span class="badge bg-light text-secondary border">Token #${idx + 1}</span>
          </td>
          <td>
            <div class="d-flex align-items-center gap-2">
              <div class="rounded-circle bg-primary-subtle text-primary fw-bold d-inline-flex align-items-center justify-content-center" style="width:36px; height:36px;">
                ${a.patientName.split(' ').map(n=>n[0]).join('')}
              </div>
              <div>
                <div class="fw-bold text-dark">${a.patientName}</div>
                <div class="text-muted small">${a.patientId || 'H1268'}</div>
              </div>
            </div>
          </td>
          <td>28 yrs • Female</td>
          <td class="text-truncate" style="max-width: 200px;" title="${a.reason}">${a.reason}</td>
          <td>${HMSApp.renderStatusBadge(a.status)}</td>
          <td class="text-end">
            <a href="consultation.html?patientId=${a.patientId || 'H1268'}&appointmentId=${a.id}" class="btn btn-sm btn-primary fw-semibold">
              <i class="bi bi-play-circle-fill me-1"></i> Start Consultation
            </a>
          </td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
